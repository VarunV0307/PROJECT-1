apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-container
          image: us-central1-docker.pkg.dev/project-62ad09b9-d8ae-4ae2-8db/gke-repo/flask-image
          ports:
            - containerPort: 8081